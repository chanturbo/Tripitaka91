name: tripitaka91
description: พระไตรปิฎกและอรรถกถาแปล ชุด 91 เล่ม ฉบับ มมร. (เล่มสีน้ำเงิน)
publish_to: 'none' 
version: 5.0.1+49
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  auto_size_text: ^3.0.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.2
  http: ^1.6.0
  shared_preferences: ^2.5.4
  simple_html_css: ^5.0.0
  hexcolor: ^3.0.2
  substring_highlight: ^1.0.33 
  intl: ^0.20.2
  just_audio: ^0.10.5
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  just_audio_windows: ^0.2.2
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5
  permission_handler: ^12.0.1
  screenshot: ^3.0.0
  archive: ^4.0.7
  flutter_phoenix: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter  
  flutter_lints: ^6.0.0 
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  color: "#FFFFFF"   # สีพื้นหลัง
  image: assets/images/splash_1.png  # โลโก้แอป (ต้องมีจริง)
  ios: true
  android: true

flutter:  
  uses-material-design: true
  assets:
     - assets/images/
     - assets/images/bookcover/
     - assets/images/ebook/     
     - assets/images/title/
     - assets/fonts/
     - assets/pdf/
     - assets/db/
     - assets/fonts/CupertinoIcons.ttf
     - assets/fonts/MaterialIcons-Regular.otf
     - assets/web/web_support.js
  fonts:
  - family: Roboto
    fonts:
      - asset: assets/fonts/Roboto.ttf
        weight: 300
      - asset: assets/fonts/Roboto.ttf
        weight: 400
      - asset: assets/fonts/Roboto.ttf
        style: italic
      - asset: assets/fonts/Roboto.ttf
        weight: 500
      - asset: assets/fonts/Roboto.ttf
        weight: 500
        style: italic
      - asset: assets/fonts/Roboto.ttf
        weight: 600
      - asset: assets/fonts/Roboto.ttf
        weight: 800
  # - family: Roboto
  #   fonts:
  #     - asset: assets/fonts/Roboto.ttf
  - family: THSarabunNew
    fonts:
      - asset: assets/fonts/THSarabunNew.ttf
  - family: THSarabunNewItalic
    fonts:
      - asset: assets/fonts/THSarabunNewItalic.ttf
  - family: THSarabunNewBold
    fonts:
      - asset: assets/fonts/THSarabunNewBold.ttf
  - family: THSarabunNewBoldItalic
    fonts:
      - asset: assets/fonts/THSarabunNewBoldItalic.ttf  
  
  - family: NotoSans
    fonts:
      - asset: assets/fonts/NotoSansThai-Regular.ttf  
  
  - family: MaterialIcons
    fonts:
      - asset: assets/fonts/MaterialIcons-Regular.otf     
  
  - family: CupertinoIcons
    fonts:
      - asset: assets/fonts/CupertinoIcons.ttf